<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Speech Coach - Live Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-primary: #38bdf8;
            --accent-success: #22c55e;
            --accent-danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-badge.active {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-success);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .dashboard-body {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .control-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .control-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
        }

        .control-card h3 {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: #0f172a;
        }

        .btn-primary:hover {
            background-color: #0ea5e9;
        }

        .btn-secondary {
            background-color: #334155;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-secondary.active-mode {
            background-color: var(--accent-primary);
            color: #0f172a;
            border-color: var(--accent-primary);
        }

        .btn-danger {
            background-color: var(--accent-danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .terminal-container {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-family: 'Courier New', Courier, monospace;
        }

        .terminal-header {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .log-entry {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #e2e8f0;
            border-left: 3px solid var(--accent-primary);
            padding-left: 10px;
        }

        .log-entry.feedback {
            border-left-color: var(--accent-success);
            color: #4ade80;
        }

        .log-entry.system {
            border-left-color: #f59e0b;
            color: #fbbf24;
        }

        @media (max-width: 768px) {
            .control-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎙️ AI Speech Coach <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">Local RTX 2050 Engine</span></h1>
            <div id="statusBadge" class="status-badge">Session Stopped</div>
        </header>

        <div class="dashboard-body">
            
            <!-- Controls Section -->
            <div class="control-section">
                <!-- Session Management -->
                <div class="control-card">
                    <h3>Session Control</h3>
                    <div class="btn-group">
                        <button id="startBtn" class="btn-primary" onclick="startSession()">Start Session</button>
                        <button id="stopBtn" class="btn-danger" onclick="stopSession()" disabled>Stop</button>
                    </div>
                </div>

                <!-- Mode Switching -->
                <div class="control-card">
                    <h3>Operating Mode</h3>
                    <div class="btn-group">
                        <button id="autoModeBtn" class="btn-secondary active-mode" onclick="switchMode('auto')">Auto (2s Pause)</button>
                        <button id="manualModeBtn" class="btn-secondary" onclick="switchMode('command')">Manual / Command</button>
                    </div>
                </div>
            </div>

            <!-- Live Output Terminal -->
            <div>
                <div class="terminal-header">
                    <span>LIVE LOG & FEEDBACK STREAM</span>
                    <span id="currentModeDisplay" style="color: var(--accent-primary);">Mode: Auto</span>
                </div>
                <div id="terminal" class="terminal-container">
                    <div class="log-entry system">[System]: Dashboard loaded. Click 'Start Session' to begin speech coaching.</div>
                </div>
            </div>

        </div>
    </div>

    <script>
      let ws = null;

      function connectWebSocket() {
          ws = new WebSocket(`ws://${window.location.host}/ws`);

          ws.onmessage = function(event) {
              const data = JSON.parse(event.data);
              
              if (data.type === 'log') {
                  appendLog(data.text, 'system');
              } else if (data.type === 'transcript') {
                  appendLog(`[Transcript]: ${data.text} (${data.duration} | ${data.wpm} WPM)`, 'normal');
              } else if (data.type === 'critique') {
                  appendLog(`🤖 Critique:\n${data.text}`, 'feedback');
              } else if (data.type === 'summary') {
                  appendLog(`💡 Quick Action Summary:\n${data.text}`, 'feedback');
              } else if (data.type === 'mode_change') {
                  switchModeUI(data.mode);
                  appendLog(data.text, 'system');
              }
          };

          ws.onclose = function() {
              setTimeout(connectWebSocket, 2000);
          };
      }

      function appendLog(text, type = 'normal') {
          const terminal = document.getElementById('terminal');
          const entry = document.createElement('div');
          entry.className = `log-entry ${type}`;
          entry.style.whiteSpace = "pre-wrap";
          entry.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
          terminal.appendChild(entry);
          terminal.scrollTop = terminal.scrollHeight;
      }

      function startSession() {
          document.getElementById('startBtn').disabled = true;
          document.getElementById('stopBtn').disabled = false;
          
          const badge = document.getElementById('statusBadge');
          badge.innerText = "Session Active";
          badge.classList.add('active');

          if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ action: "start" }));
          }
      }

      function stopSession() {
          document.getElementById('startBtn').disabled = false;
          document.getElementById('stopBtn').disabled = true;
          
          const badge = document.getElementById('statusBadge');
          badge.innerText = "Session Stopped";
          badge.classList.remove('active');

          if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ action: "stop" }));
          }
      }

      function switchMode(mode) {
          if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ action: "set_mode", mode: mode }));
          }
          switchModeUI(mode);
      }

      function switchModeUI(mode) {
          const autoBtn = document.getElementById('autoModeBtn');
          const manualBtn = document.getElementById('manualModeBtn');
          const modeDisplay = document.getElementById('currentModeDisplay');

          if (mode === 'auto') {
              autoBtn.classList.add('active-mode');
              manualBtn.classList.remove('active-mode');
              modeDisplay.innerText = "Mode: Auto (Pause Triggered)";
          } else {
              manualBtn.classList.add('active-mode');
              autoBtn.classList.remove('active-mode');
              modeDisplay.innerText = "Mode: Manual (Command Only)";
          }
      }

      // Connect on load
      window.onload = connectWebSocket;
  </script>
</body>
</html>
